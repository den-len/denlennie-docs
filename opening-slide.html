<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>VBA AI Workshop · London · Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Ubuntu:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./brand.css">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #0B2141; color: #F5F4EF;
      font-family: 'Ubuntu', system-ui, -apple-system, sans-serif; font-weight: 300;
      display: flex; flex-direction: column;
      padding: clamp(2rem, 5vh, 4.5rem) clamp(2rem, 6vw, 6rem);
      box-sizing: border-box;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .top img { height: clamp(34px, 4.5vh, 52px); width: auto; display: block; }
    .top .where { font-family: 'Poppins', system-ui, sans-serif; font-weight: 600; font-size: clamp(0.7rem, 1.4vw, 1rem); letter-spacing: 0.16em; text-transform: uppercase; color: #F5F4EF; opacity: 0.8; white-space: nowrap; }

    main { flex: 1; display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: clamp(2rem, 5vw, 5rem); }
    .text { display: flex; flex-direction: column; justify-content: center; }
    .qr-card { flex: 0 0 auto; background: #FFFFFF; border-radius: 6px; border-top: 5px solid #D9531E; padding: clamp(1rem, 2vw, 1.6rem); text-align: center; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .qr-card .qr { display: block; width: clamp(150px, 18vw, 250px); height: auto; }
    .qr-card .qr-label { font-family: 'Poppins', system-ui, sans-serif; font-weight: 600; font-size: clamp(0.8rem, 1.4vw, 1.05rem); color: #0B2141; margin-top: 0.8rem; }
    .qr-card .qr-user { font-family: 'Ubuntu', system-ui, sans-serif; font-size: clamp(0.7rem, 1.2vw, 0.95rem); color: #D9531E; margin-top: 0.2rem; }
    .eyebrow-line { font-family: 'Poppins', system-ui, sans-serif; font-weight: 600; font-size: clamp(0.8rem, 1.6vw, 1.2rem); letter-spacing: 0.2em; text-transform: uppercase; color: #D9531E; margin: 0 0 clamp(1rem, 2.5vh, 2rem); }
    .hero { font-family: 'Poppins', system-ui, sans-serif; font-weight: 700; font-size: clamp(2.6rem, 7.8vw, 8rem); line-height: 1.0; letter-spacing: -0.02em; margin: 0; color: #FFFFFF; white-space: nowrap; }
    .hero .or { color: #D9531E; }
    .rule { width: clamp(70px, 9vw, 130px); height: 5px; background: #D9531E; border: 0; margin: clamp(1.4rem, 3vh, 2.6rem) 0; border-radius: 3px; }
    .sub { font-size: clamp(1.1rem, 2.6vw, 2rem); line-height: 1.35; max-width: 22ch; color: #F5F4EF; opacity: 0.92; margin: 0; }

    .foot { display: flex; align-items: baseline; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; font-family: 'Poppins', system-ui, sans-serif; font-weight: 500; font-size: clamp(0.75rem, 1.5vw, 1.1rem); letter-spacing: 0.04em; }
    .foot .venue { color: #F5F4EF; opacity: 0.7; }
    .foot .coffee { color: #D9531E; }
    @media (max-width: 820px) { main { flex-direction: column; align-items: flex-start; gap: 1.5rem; } .sub { max-width: none; } }
  </style>
</head>
<body>
  <div class="top">
    <img src="./VBA_wordmark_grey.png" alt="Video Business Accelerator">
    <span class="where">London · 23–24 June 2026</span>
  </div>

  <main>
    <div class="text">
      <p class="eyebrow-line">The VBA AI Workshop</p>
      <h1 class="hero">Less AI.<br><span class="or">Used better.</span></h1>
      <hr class="rule">
      <p class="sub">Two days. Real tools, real leads, and a system you actually run.</p>
    </div>
    <div class="qr-card">
      <img class="qr" src="./signal-qr.png" alt="Add Den on Signal, QR code">
      <div class="qr-label">Add me on Signal</div>
      <div class="qr-user">denlennie.54</div>
    </div>
  </main>

  <div class="foot">
    <span class="venue">Radisson Blu, Mercer Street, Covent Garden</span>
    <span class="coffee">Grab a coffee. We begin at 10.</span>
  </div>
</body>
</html>
